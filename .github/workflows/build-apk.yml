name: Build APK

# Builds a debug APK on every push and on demand. The APK is uploaded as a
# workflow artifact you can download straight from the Actions tab on your
# phone (github.com/HananelSabag/Workout-Tracker/actions → latest run →
# "Artifacts" → workout-tracker-debug-apk).

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Caches AGP/Gradle/Kotlin/dependencies so subsequent builds finish in a
      # couple of minutes instead of pulling everything fresh from Maven.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Locate APK
        id: locate
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK produced under app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          # Name includes the short SHA so each run is identifiable on the phone.
          name: workout-tracker-debug-${{ github.sha }}
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
